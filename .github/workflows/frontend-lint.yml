name: Frontend Lint

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-lint.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-lint.yml"

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run lint
        working-directory: frontend
        run: npm run lint
